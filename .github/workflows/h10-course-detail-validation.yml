name: H10 Course Detail regression

on:
  push:
    branches: [fix/r35-h10-course-inactive-enrollment]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Full Vitest
        run: npm run test -- --maxWorkers=2
      - name: Production build
        run: npm run build
