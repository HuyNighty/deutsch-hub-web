name: H15-S1 Explore Germany validation

on:
  push:
    branches: [feat/h15-s1-explore-published-navigation]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Full Vitest
        run: npm run test -- --maxWorkers=2
      - name: Production build (same-origin proxy fixture)
        env:
          VITE_API_BASE_URL: /deutsch-hub
        run: npm run build
