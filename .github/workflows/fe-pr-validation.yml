name: FE PR validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PR merge ref
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Full Vitest (controlled workers)
        run: npm run test -- --maxWorkers=2

      - name: Production API setting fails closed
        run: |
          if env -u VITE_API_BASE_URL npm run build > /tmp/missing-api.log 2>&1; then
            echo "Production build must fail without VITE_API_BASE_URL"
            exit 1
          fi
          grep -q "VITE_API_BASE_URL is required" /tmp/missing-api.log
          if VITE_API_BASE_URL=http://localhost:8080/deutsch-hub npm run build > /tmp/insecure-api.log 2>&1; then
            echo "Production build must reject an HTTP/localhost backend"
            exit 1
          fi
          grep -q "requires HTTPS for production" /tmp/insecure-api.log

      - name: Vite production build (same-origin proxy fixture)
        env:
          VITE_API_BASE_URL: /deutsch-hub
        run: npm run build
