name: H8 Catalogue branch validation

on:
  push:
    branches: [feat/r35-h8-catalogue-pagination]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Vitest
        run: npm run test -- --maxWorkers=2
      - name: Build
        run: npm run build
